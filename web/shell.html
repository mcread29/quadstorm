<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101b20">
  <title>Stalberg</title>
  <link rel="icon" href="favicon.ico">
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b1317;
      color: #e3eee9;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 20%, rgba(54, 113, 117, 0.2), transparent 45%),
        #0b1317;
    }

    body {
      display: grid;
      place-items: center;
      user-select: none;
    }

    #game-shell {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    #canvas {
      display: block;
      width: min(100vw, 160vh);
      height: auto;
      aspect-ratio: 8 / 5;
      border: 0;
      outline: 0;
      background: #142027;
      box-shadow: 0 0 80px rgba(0, 0, 0, 0.45);
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      background: #0b1317;
      transition: opacity 240ms ease, visibility 240ms ease;
    }

    #loading.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading-card {
      width: min(360px, calc(100vw - 48px));
      text-align: center;
    }

    .mark {
      width: 52px;
      height: 52px;
      margin: 0 auto 18px;
      border: 2px solid rgba(132, 210, 195, 0.25);
      border-top-color: #84d2c3;
      border-radius: 50%;
      animation: spin 900ms linear infinite;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      font-weight: 650;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    #status {
      min-height: 20px;
      margin: 0 0 16px;
      color: #91aaa6;
      font-size: 13px;
    }

    .progress-track {
      height: 3px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
    }

    #progress {
      width: 8%;
      height: 100%;
      border-radius: inherit;
      background: #84d2c3;
      transition: width 160ms ease;
    }

    #toolbar {
      position: fixed;
      top: max(14px, env(safe-area-inset-top));
      right: max(14px, env(safe-area-inset-right));
      z-index: 10;
      display: flex;
      gap: 8px;
      opacity: 0;
      transform: translateY(-6px);
      transition: opacity 180ms ease, transform 180ms ease;
    }

    body:hover #toolbar,
    body:focus-within #toolbar {
      opacity: 1;
      transform: translateY(0);
    }

    button {
      appearance: none;
      border: 1px solid rgba(211, 237, 230, 0.2);
      border-radius: 9px;
      padding: 9px 12px;
      background: rgba(10, 22, 26, 0.78);
      color: #dcebe7;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }

    button:hover { background: rgba(33, 66, 69, 0.9); }

    #controls {
      position: fixed;
      left: max(16px, env(safe-area-inset-left));
      bottom: max(16px, env(safe-area-inset-bottom));
      z-index: 8;
      display: flex;
      gap: 14px;
      padding: 10px 13px;
      border: 1px solid rgba(211, 237, 230, 0.12);
      border-radius: 10px;
      background: rgba(10, 22, 26, 0.66);
      color: #a9bdb8;
      font-size: 11px;
      letter-spacing: 0.03em;
      backdrop-filter: blur(10px);
      transition: opacity 300ms ease;
    }

    #controls.faded { opacity: 0; pointer-events: none; }
    #controls strong { color: #e2efeb; font-weight: 600; }

    #error {
      display: none;
      margin-top: 14px;
      color: #f19a91;
      font-size: 12px;
      line-height: 1.45;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (hover: none) {
      #toolbar { opacity: 1; transform: none; }
      #controls { display: none; }
    }
  </style>
</head>
<body>
  <main id="game-shell">
    <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
  </main>

  <section id="loading" aria-live="polite">
    <div class="loading-card">
      <div class="mark" aria-hidden="true"></div>
      <h1>Stalberg</h1>
      <p id="status">Preparing world…</p>
      <div class="progress-track"><div id="progress"></div></div>
      <div id="error"></div>
    </div>
  </section>

  <nav id="toolbar" aria-label="Game controls">
    <button id="fullscreen" type="button">Fullscreen</button>
  </nav>

  <aside id="controls">
    <span><strong>WASD</strong> move</span>
    <span><strong>Space</strong> dash</span>
    <span><strong>Mouse</strong> aim</span>
    <span><strong>Click</strong> fire</span>
    <span><strong>F1</strong> arena</span>
    <span><strong>R</strong> restart</span>
  </aside>

  <script>
    const loading = document.getElementById('loading');
    const statusText = document.getElementById('status');
    const progress = document.getElementById('progress');
    const errorText = document.getElementById('error');
    const canvas = document.getElementById('canvas');
    const controls = document.getElementById('controls');
    let dependencyTotal = 0;

    document.getElementById('fullscreen').addEventListener('click', async () => {
      try {
        if (document.fullscreenElement) {
          await document.exitFullscreen();
        } else {
          await document.getElementById('game-shell').requestFullscreen();
          canvas.focus();
        }
      } catch (error) {
        console.error('Fullscreen request failed', error);
      }
    });

    window.setTimeout(() => controls.classList.add('faded'), 9000);
    window.addEventListener('keydown', () => controls.classList.add('faded'), { once: true });

    var Module = {
      canvas,
      print: (...args) => console.log(...args),
      printErr: (...args) => console.error(...args),
      setStatus(text) {
        if (!text) {
          loading.classList.add('hidden');
          canvas.focus();
          return;
        }
        statusText.textContent = text.replace(/\([^)]*\)/, '').trim() || 'Loading…';
        const match = text.match(/\((\d+(?:\.\d+)?)\/(\d+)\)/);
        if (match) {
          progress.style.width = `${Math.min(100, Number(match[1]) / Number(match[2]) * 100)}%`;
        }
      },
      monitorRunDependencies(remaining) {
        dependencyTotal = Math.max(dependencyTotal, remaining);
        const completed = dependencyTotal === 0 ? 1 : (dependencyTotal - remaining) / dependencyTotal;
        progress.style.width = `${Math.max(8, completed * 100)}%`;
      }
    };

    window.addEventListener('error', (event) => {
      loading.classList.remove('hidden');
      statusText.textContent = 'Unable to start the game';
      errorText.style.display = 'block';
      errorText.textContent = event.message || 'Check the browser console for details.';
    });
  </script>
  {{{ SCRIPT }}}
</body>
</html>
